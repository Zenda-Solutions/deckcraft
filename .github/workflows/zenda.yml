# Zenda's build for Work: tests the zenda patches and packs the portable zip as a workflow artifact.
# A tag `zenda-v<version>-z<n>` (for example zenda-v0.12.0-z1) also publishes the zip as a GitHub
# release of this public fork; Work's manifest downloads it from there, like upstream's releases.
name: Zenda

on:
  push:
    branches: ['zenda/**']
    tags: ['zenda-*']
  workflow_dispatch:
    inputs:
      z:
        description: "Zenda build number (the n in -z<n>)"
        type: string
        default: "1"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pinned fonts (same revision as upstream v0.12.0 release.yml)
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/storytold/craft-fonts ..\craft-fonts
          git -C ..\craft-fonts checkout 37827adc41fd165f9a9234ac40f94dbad353aa69
          "CRAFT_FONTS_DIR=$((Resolve-Path ..\craft-fonts).Path)" >> $env:GITHUB_ENV
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Zenda patch tests (both builds)
        run: |
          foreach ($zenda in @($false, $true)) {
            $features = if ($zenda) { @('--features', 'zenda') } else { @() }
            foreach ($filter in @('zenda', 'i18n', 'about')) {
              cargo test --config 'profile.dev.package.deckcraft-ui-egui.opt-level=0' -p deckcraft-ui-egui --lib @features $filter
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
            }
          }
      - name: Upstream engine tests
        run: cargo test -p deckcraft-engine --lib
      - name: Control channel tests
        run: cargo test -p deckcraft --bins control_server
      - name: Package
        shell: pwsh
        run: |
          $z = if ('${{ inputs.z }}') { '${{ inputs.z }}' }
               elseif ($env:GITHUB_REF_NAME -match '^zenda-v.+-z(\d+)$') { $Matches[1] }
               else { '1' }
          pwsh zenda/package.ps1 -Z $z
      - uses: actions/upload-artifact@v4
        with:
          name: deckcraft-zenda-portable
          path: dist/zenda/*.zip
      - name: Release (zenda-v* tags)
        if: startsWith(github.ref, 'refs/tags/zenda-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem dist/zenda/*.zip | Select-Object -First 1
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $notes = "Zenda's DeckCraft build for Work. size: $($zip.Length) sha256: $sha"
          gh release create $env:GITHUB_REF_NAME $zip.FullName --title $env:GITHUB_REF_NAME --notes $notes
